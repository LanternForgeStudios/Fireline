name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # false, not true: cancelling an in-flight run can leave the Pages
  # environment mid-deployment, which has shown up as "build succeeded,
  # deploy silently didn't happen" on the next automatic run (a manual
  # workflow_dispatch — a fresh run outside the cancelled chain — then
  # "fixes" it). Queuing runs back-to-back instead of racing them costs
  # nothing for a repo this size.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      # itch.io needs relative asset paths (it extracts the zip into its own
      # CDN path, not /Fireline/), so it gets a second build with a different
      # base — see vite.config.ts's `mode === 'itch'` branch.
      - run: npm run build:itch
      - uses: actions/upload-artifact@v4
        with:
          name: dist-itch
          path: dist-itch

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  deploy-itch:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-itch
          path: dist-itch
      - uses: yeslayla/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_CREDENTIALS }}
          ITCH_USER: lanternforgestudios
          ITCH_GAME: fireline
          CHANNEL: html5
          PACKAGE: dist-itch
